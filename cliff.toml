# git-cliff configuration for docopt.
#
# The project history predates conventional commits, so parsers classify
# the sentence-style subjects by their leading verb. New commits should
# use conventional commit format (feat:/fix:/chore:); the parsers below
# already match those too since they operate on the message text.

[changelog]
header = "# Changelog\n\nAll notable changes to this project are documented in this file.\n"
body = """
{% if version %}\
## {{ version | trim_start_matches(pat="v") }} - {{ timestamp | date(format="%Y-%m-%d") }}
{% else %}\
## Unreleased
{% endif %}
{% for group, commits in commits | group_by(attribute="group") %}\
### {{ group }}
{% for commit in commits %}\
- {{ commit.message | split(pat="\n") | first | upper_first }}
{% endfor %}
{% endfor %}
"""
trim = true

[git]
conventional_commits = false
filter_unconventional = false
split_commits = false
protect_breaking_commits = true
tag_pattern = "v[0-9].*"
sort_commits = "oldest"

commit_parsers = [
  { message = "^feat", group = "Features" },
  { message = "^fix", group = "Bug Fixes" },
  { message = "print_config_option", group = "Features" },
  { message = "^Add exit: false", group = "Features" },
  { message = "^(Point CI|Build ameba|Lint only|Fix README|Remove accidentally|Unique tempfiles|Remove dead)", group = "Miscellaneous" },
  { message = "^(Print|Fix|Detect|Strip|Treat|Coerce|Make|Keep|Honor|Warn|Remove)", group = "Bug Fixes" },
  { message = "^.*", group = "Miscellaneous" },
]
